[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-safety-agent-v2"
version = "0.7.0"
description = "Manager-routed functional-safety agents with lease-safe parallel DAG execution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Functional Safety Agent Team"}]
dependencies = [
  "openpyxl>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
fs-agent = "fs_agent_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fs_agent_v2.web" = [
  "static/*.html",
  "static/dist/*.html",
  "static/dist/assets/*",
]

